name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    # ✅ job-level permissions so the bot can open PRs and write CHANGELOG
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          release-type: simple
          package-name: plumber_2.0
          token: ${{ secrets.GITHUB_TOKEN }}
