name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}